# OpenShift Service Mesh 3.x - Weighted Routing Deployment
#
# Deploys OSSM 3.x infrastructure and configures weighted traffic splitting
# between the Legacy (.NET Framework 4.8 / Windows VM) and Modern (.NET 8 / container)
# applications using the Kubernetes Gateway API.
#
# Prerequisites:
#   - Red Hat OpenShift Service Mesh 3 operator installed on the cluster
#   - LegacyWebApp deployed in the dotnet-legacy namespace
#   - ModernWebApp deployed in the dotnet-modern namespace
#
# Usage:
#   oc apply -f openshift-ossm-deployment.yaml
#   oc label namespace dotnet-modern istio-injection=enabled
#   oc rollout restart deployment/dotnet-modern -n dotnet-modern
#
# To adjust the traffic split, edit the HTTPRoute backendRefs weights below.

# --- Namespaces ---

apiVersion: v1
kind: Namespace
metadata:
  name: istio-cni
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system

# --- Service Mesh Control Plane ---

---
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
spec:
  version: v1.27.3
  namespace: istio-cni
---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  version: v1.27.3
  namespace: istio-system
  updateStrategy:
    type: InPlace

# --- Gateway API Resources ---

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dotnet-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

# --- Cross-Namespace ReferenceGrants ---

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-istio-system
  namespace: dotnet-legacy
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: istio-system
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-istio-system
  namespace: dotnet-modern
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: istio-system
  to:
  - group: ""
    kind: Service

# --- Weighted HTTPRoute (90% Legacy / 10% Modern) ---

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dotnet-weighted-route
  namespace: istio-system
spec:
  parentRefs:
  - name: dotnet-gateway
  rules:
  - backendRefs:
    - name: legacy-web-app-svc
      namespace: dotnet-legacy
      port: 80
      weight: 90
    - name: dotnet-modern
      namespace: dotnet-modern
      port: 8080
      weight: 10

# --- OpenShift Route (external access with TLS) ---

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dotnet-mesh-gateway
  namespace: istio-system
spec:
  host: dotnet-mesh-dotnet.apps.aromerot.redhat-openshift.com
  to:
    kind: Service
    name: dotnet-gateway-istio
    weight: 100
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
